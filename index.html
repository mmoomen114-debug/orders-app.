<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الأوردرات</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 15px; background: #f4f6f9; direction: rtl; }
    .nav { display: flex; gap: 10px; margin-bottom: 15px; }
    .nav button { flex: 1; padding: 12px; border: none; background: #e0e0e0; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .nav button.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    
    .order-summary-header { background: #e8f0fe; border-right: 5px solid #1a73e8; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
    .summary-title { font-size: 13px; color: #555; }
    .summary-value { font-size: 16px; font-weight: bold; color: #1a73e8; }
    
    .stats-container { display: flex; gap: 8px; margin-bottom: 15px; }
    .stat-box { flex: 1; background: white; padding: 10px; border-radius: 8px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .stat-number { font-size: 16px; font-weight: bold; margin-top: 4px; }
    
    label { font-weight: bold; margin-top: 10px; display: block; color: #333; font-size: 14px; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    .submit-btn { background: #28a745; color: white; font-weight: bold; border: none; margin-top: 15px; font-size: 16px; cursor: pointer; }
    .order-item { background: white; padding: 12px; border-radius: 10px; border-right: 5px solid #ffc107; margin-bottom: 10px; cursor: pointer; }
    .order-item.done { border-right-color: #28a745; }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; }
    .badge { padding: 3px 6px; border-radius: 5px; font-size: 11px; color: white; }
    .badge.pending { background: #ffc107; color: #000; }
    .badge.completed { background: #28a745; }
    .image-gallery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .image-gallery img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; }
  </style>
</head>
<body>

  <div class="nav">
    <button id="tab1-btn" class="active" onclick="switchTab('tab1')">تعديل أوردر 📝</button>
    <button id="tab2-btn" onclick="switchTab('tab2'); loadOrders();">سجل الأوردرات 📋</button>
  </div>

  <div id="tab1" class="tab-content active">
    <div class="card">
      <div class="order-summary-header">
        <div class="summary-title">اسم المحوّل: <span id="headerName" class="summary-value">غير محدد</span></div>
        <div class="summary-title" style="margin-top: 4px;">المبلغ المستلم: <span id="headerAmount" class="summary-value" style="color: #28a745;">0 جنيه</span></div>
      </div>

      <label>رقم الصف (Row ID):</label>
      <input type="number" id="rowIndex" placeholder="رقم الصف">

      <label>العنوان:</label>
      <input type="text" id="address" placeholder="عنوان العميل">

      <label>تفاصيل الأوردر:</label>
      <textarea id="orderDetails" rows="2" placeholder="المنتجات والكميات"></textarea>

      <label>الصور المرفوعة سابقاً:</label>
      <div id="previewImages" class="image-gallery">لا توجد صور</div>

      <label>إرفاق صور جديدة:</label>
      <input type="file" id="images" multiple accept="image/*">

      <label>ملاحظات:</label>
      <textarea id="notes" rows="2" placeholder="ملاحظات إضافية"></textarea>

      <button onclick="saveOrder()" id="saveBtn" class="submit-btn">حفظ البيانات 💾</button>
    </div>
  </div>

  <div id="tab2" class="tab-content">
    <div class="stats-container">
      <div class="stat-box" style="border-bottom: 3px solid #28a745;">
        <div style="font-size: 11px; color: #555;">إجمالي الفلوس</div>
        <div id="totalSum" class="stat-number" style="color: #28a745;">0 ج.م</div>
      </div>
      <div class="stat-box" style="border-bottom: 3px solid #ffc107;">
        <div style="font-size: 11px; color: #555;">معلقة</div>
        <div id="pendingCount" class="stat-number" style="color: #d39e00;">0</div>
      </div>
      <div class="stat-box" style="border-bottom: 3px solid #007bff;">
        <div style="font-size: 11px; color: #555;">تم معالجتها</div>
        <div id="completedCount" class="stat-number" style="color: #007bff;">0</div>
      </div>
    </div>

    <div id="ordersList">جاري تحميل الأوردرات...</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZEpzDNugIry4YLdc_4uK3gzOC95VAftd5Nkv-xkA8NYg36EOr6y2N81ETHkVfr74/exec";

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      document.getElementById(tabId + '-btn').classList.add('active');
    }

    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('row')) {
      document.getElementById('rowIndex').value = urlParams.get('row');
    }

    async function loadOrders() {
      const container = document.getElementById('ordersList');
      container.innerHTML = "جاري التحميل السريع...";

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        container.innerHTML = "";
        
        let totalSum = 0;
        let pendingCount = 0;
        let completedCount = 0;

        data.reverse().forEach(item => {
          const isDone = item.status && item.status.includes("تم المعالجة");
          
          const val = parseFloat(item.amount) || 0;
          totalSum += val;
          if (isDone) {
            completedCount++;
          } else {
            pendingCount++;
          }

          const div = document.createElement('div');
          div.className = `order-item ${isDone ? 'done' : ''}`;
          div.onclick = () => selectOrder(item);
          div.innerHTML = `
            <div class="order-header">
              <span>صف #${item.rowIndex} - ${item.amount} جنيه</span>
              <span class="badge ${isDone ? 'completed' : 'pending'}">${isDone ? 'تم المعالجة' : 'معلقة'}</span>
            </div>
            <div style="font-size: 12px; color: #666; margin-top: 4px;">
              الاسم: ${item.name || 'غير مسجل'} | المحول: ${item.phone || '-'} <br>
              التاريخ: ${item.date}
            </div>
          `;
          container.appendChild(div);
        });

        document.getElementById('totalSum').innerText = totalSum.toLocaleString() + ' ج.م';
        document.getElementById('pendingCount').innerText = pendingCount;
        document.getElementById('completedCount').innerText = completedCount;

      } catch (err) {
        container.innerHTML = "حدث خطأ في تحميل البيانات.";
      }
    }

    function selectOrder(item) {
      document.getElementById('rowIndex').value = item.rowIndex;
      document.getElementById('address').value = item.address || '';
      document.getElementById('orderDetails').value = item.orderDetails || '';
      document.getElementById('headerName').innerText = item.name || 'غير مسجل';
      document.getElementById('headerAmount').innerText = (item.amount || '0') + ' جنيه';

      const gallery = document.getElementById('previewImages');
      gallery.innerHTML = "";
      
      if(item.imageUrls) {
        item.imageUrls.split('\n').forEach(url => {
          if(url.trim()) {
            let fileId = "";
            const match = url.match(/[-\w]{25,}/);
            if (match) fileId = match[0];

            if (fileId) {
              const img = document.createElement('img');
              img.src = `https://lh3.googleusercontent.com/d/${fileId}=s400`;
              img.onerror = function() {
                this.src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w400`;
              };
              img.onclick = () => window.open(url, '_blank');
              gallery.appendChild(img);
            }
          }
        });
      } else {
        gallery.innerHTML = "لا توجد صور";
      }

      switchTab('tab1');
    }

    async function saveOrder() {
      const btn = document.getElementById('saveBtn');
      const rowIndex = document.getElementById('rowIndex').value;
      if(!rowIndex) return alert('برجاء تحديد رقم الصف أولاً');

      btn.disabled = true;
      btn.innerText = "جاري الحفظ السريع...";

      const files = document.getElementById('images').files;
      let imagesBase64 = [];
      for(let file of files) {
        const base64 = await toBase64(file);
        imagesBase64.push({ base64: base64.split(',')[1], mimeType: file.type });
      }

      const payload = {
        action: "UPDATE_ORDER",
        rowIndex: rowIndex,
        address: document.getElementById('address').value,
        orderDetails: document.getElementById('orderDetails').value,
        notes: document.getElementById('notes').value,
        images: imagesBase64
      };

      try {
        const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await response.json();
        if(data.status === 'success') {
          alert('تم الحفظ بنجاح! 🎉');
        }
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "حفظ البيانات 💾";
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  </script>
</body>
</html>
