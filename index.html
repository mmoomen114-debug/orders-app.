<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الأوردرات</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 15px; background: #f4f6f9; direction: rtl; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .nav button { flex: 1; padding: 12px; border: none; background: #e0e0e0; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .nav button.active { background: #007bff; color: white; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    label { font-weight: bold; margin-top: 10px; display: block; color: #333; }
    input, textarea, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    .submit-btn { background: #28a745; color: white; font-weight: bold; border: none; margin-top: 15px; font-size: 16px; }
    
    /* تنسيق قائمة الأوردرات */
    .order-item { background: white; padding: 15px; border-radius: 10px; border-right: 5px solid #ffc107; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
    .order-item.done { border-right-color: #28a745; }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; }
    .badge { padding: 4px 8px; border-radius: 5px; font-size: 12px; color: white; }
    .badge.pending { background: #ffc107; color: #000; }
    .badge.completed { background: #28a745; }
  </style>
</head>
<body>

  <!-- شريط التنقل بين الصفحات -->
  <div class="nav">
    <button id="tab1-btn" class="active" onclick="switchTab('tab1')">تعديل أوردر 📝</button>
    <button id="tab2-btn" onclick="switchTab('tab2'); loadOrders();">سجل الأوردرات 📋</button>
  </div>

  <!-- الصفحة الأولى: تعديل وتحديث الأوردر -->
  <div id="tab1" class="tab-content active">
    <div class="card">
      <label>رقم الصف (Row ID):</label>
      <input type="number" id="rowIndex" placeholder="رقم الصف">

      <label>العنوان:</label>
      <input type="text" id="address" placeholder="عنوان العميل">

      <label>تفاصيل الأوردر:</label>
      <textarea id="orderDetails" rows="3" placeholder="المنتجات والكميات"></textarea>

      <label>إرفاق صور:</label>
      <input type="file" id="images" multiple accept="image/*">

      <label>ملاحظات:</label>
      <textarea id="notes" rows="2" placeholder="ملاحظات إضافية"></textarea>

      <button onclick="saveOrder()" id="saveBtn" class="submit-btn">حفظ البيانات 💾</button>
    </div>
  </div>

  <!-- الصفحة الثانية: عرض جميع الأوردرات -->
  <div id="tab2" class="tab-content">
    <div id="ordersList">جاري تحميل الأوردرات...</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMSV_K8gWecbwqkiK2TD95mXhtSHUg5j-jYiybiNPkwAVgeq4IZZcG3yf2rUyi5mE/exec"; // ضع رابط Apps Script هنا

    // التبديل بين التبويبات
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      document.getElementById(tabId + '-btn').classList.add('active');
    }

    // جلب رقم الصف من الرابط إذا قادم من إشعار
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('row')) {
      document.getElementById('rowIndex').value = urlParams.get('row');
    }

    // جلب كافة الأوردرات وعرضها
    async function loadOrders() {
      const container = document.getElementById('ordersList');
      container.innerHTML = "جاري التحميل...";

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        container.innerHTML = "";
        if(data.length === 0) {
          container.innerHTML = "<p>لا يوجد أوردرات مسجلة.</p>";
          return;
        }

        data.reverse().forEach(item => {
          const isDone = item.status.includes("تم المعالجة");
          const div = document.createElement('div');
          div.className = `order-item ${isDone ? 'done' : ''}`;
          div.onclick = () => selectOrder(item.rowIndex);
          
          div.innerHTML = `
            <div class="order-header">
              <span>صف #${item.rowIndex} - ${item.amount} جنيه</span>
              <span class="badge ${isDone ? 'completed' : 'pending'}">${isDone ? 'تم المعالجة' : 'معلقة'}</span>
            </div>
            <div style="font-size: 13px; color: #666; margin-top: 5px;">
              الاسم: ${item.name || 'غير مسجل'} | المحول: ${item.phone || '-'} <br>
              التاريخ: ${item.date}
            </div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = "حدث خطأ في جلب البيانات.";
      }
    }

    // عند الضغط على أوردر في القائمة يُفتح للتعديل تلقائياً
    function selectOrder(rowIndex) {
      document.getElementById('rowIndex').value = rowIndex;
      switchTab('tab1');
    }

    async function saveOrder() {
      const btn = document.getElementById('saveBtn');
      const rowIndex = document.getElementById('rowIndex').value;
      if(!rowIndex) return alert('برجاء تحديد رقم الصف أولاً');

      btn.disabled = true;
      btn.innerText = "جاري الحفظ...";

      const address = document.getElementById('address').value;
      const orderDetails = document.getElementById('orderDetails').value;
      const notes = document.getElementById('notes').value;
      const files = document.getElementById('images').files;

      let imagesBase64 = [];
      for(let file of files) {
        const base64 = await toBase64(file);
        imagesBase64.push({ base64: base64.split(',')[1], mimeType: file.type });
      }

      const payload = {
        action: "UPDATE_ORDER",
        rowIndex: rowIndex,
        address: address,
        orderDetails: orderDetails,
        notes: notes,
        images: imagesBase64
      };

      try {
        const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await response.json();
        if(data.status === 'success') {
          alert('تم الحفظ والتحديث بنجاح! 🎉');
        }
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "حفظ البيانات 💾";
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  </script>
</body>
</html>
