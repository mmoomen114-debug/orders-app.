<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الأوردرات</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f0f2f5; direction: rtl; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto; }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    label { font-weight: bold; margin-top: 12px; display: block; color: #333; }
    input, textarea, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 18px; font-size: 16px; }
    button:hover { background: #218838; }
  </style>
</head>
<body>

  <div class="card">
    <h2>تحديث بيانات الأوردر 📦</h2>
    
    <label>رقم الصف (Row ID):</label>
    <input type="number" id="rowIndex" placeholder="رقم الصف تلقائياً">

    <label>العنوان:</label>
    <input type="text" id="address" placeholder="عنوان العميل التفصيلي">

    <label>تفاصيل الأوردر:</label>
    <textarea id="orderDetails" rows="3" placeholder="المنتجات والكميات"></textarea>

    <label>إرفاق صور (Google Drive):</label>
    <input type="file" id="images" multiple accept="image/*">

    <label>ملاحظات:</label>
    <textarea id="notes" rows="2" placeholder="ملاحظات إضافية"></textarea>

    <button onclick="saveOrder()" id="saveBtn">حفظ البيانات 💾</button>
  </div>

  <script>
    // Plak hier de Web App URL die je krijgt na het Deployen van Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5iCBH0zztLdaUZK2FUiIzFMaw36wDUDlzMyu8LE0QOGVlheCk0vPhvvMs-CILuQE/exec";

    // Automatisch het rijnummer ophalen uit de URL
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('row')) {
      document.getElementById('rowIndex').value = urlParams.get('row');
    }

    async function saveOrder() {
      const btn = document.getElementById('saveBtn');
      const rowIndex = document.getElementById('rowIndex').value;
      
      if(!rowIndex) return alert('برجاء تحديد رقم الصف أولاً');

      btn.disabled = true;
      btn.innerText = "جاري الحفظ والرفع...";

      const address = document.getElementById('address').value;
      const orderDetails = document.getElementById('orderDetails').value;
      const notes = document.getElementById('notes').value;
      const files = document.getElementById('images').files;

      let imagesBase64 = [];
      for(let file of files) {
        const base64 = await toBase64(file);
        imagesBase64.push({
          base64: base64.split(',')[1],
          mimeType: file.type
        });
      }

      const payload = {
        action: "UPDATE_ORDER",
        rowIndex: rowIndex,
        address: address,
        orderDetails: orderDetails,
        notes: notes,
        images: imagesBase64
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        
        if(data.status === 'success') {
          alert('تم حفظ البيانات ورفع الصور بنجاح! 🎉');
        } else {
          alert('حدث خطأ: ' + data.message);
        }
      } catch (err) {
        alert('حدث خطأ في الاتصال: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "حفظ البيانات 💾";
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  </script>
</body>
</html>
