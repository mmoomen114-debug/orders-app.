<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الأوردرات</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 15px; background: #f4f6f9; direction: rtl; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .nav button { flex: 1; padding: 12px; border: none; background: #e0e0e0; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .nav button.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    
    /* شريط تفاصيل التحويل العلوية */
    .order-summary-header { background: #e8f0fe; border-right: 5px solid #1a73e8; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .summary-title { font-size: 14px; color: #555; margin-bottom: 4px; }
    .summary-value { font-size: 18px; font-weight: bold; color: #1a73e8; }
    
    label { font-weight: bold; margin-top: 10px; display: block; color: #333; }
    input, textarea, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    .submit-btn { background: #28a745; color: white; font-weight: bold; border: none; margin-top: 15px; font-size: 16px; }
    
    .order-item { background: white; padding: 15px; border-radius: 10px; border-right: 5px solid #ffc107; margin-bottom: 10px; cursor: pointer; }
    .order-item.done { border-right-color: #28a745; }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; }
    .badge { padding: 4px 8px; border-radius: 5px; font-size: 12px; color: white; }
    .badge.pending { background: #ffc107; color: #000; }
    .badge.completed { background: #28a745; }
    
    .image-gallery { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .image-gallery img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <div class="nav">
    <button id="tab1-btn" class="active" onclick="switchTab('tab1')">تعديل أوردر 📝</button>
    <button id="tab2-btn" onclick="switchTab('tab2'); loadOrders();">سجل الأوردرات 📋</button>
  </div>

  <!-- صفحة التعديل -->
  <div id="tab1" class="tab-content active">
    <div class="card">
      
      <!-- هيدر تفاصيل التحويل العلوي -->
      <div class="order-summary-header">
        <div class="summary-title">اسم المحوّل: <span id="headerName" class="summary-value">غير محدد</span></div>
        <div class="summary-title" style="margin-top: 6px;">المبلغ المستلم: <span id="headerAmount" class="summary-value" style="color: #28a745;">0 جنيه</span></div>
      </div>

      <label>رقم الصف (Row ID):</label>
      <input type="number" id="rowIndex" placeholder="رقم الصف">

      <label>العنوان:</label>
      <input type="text" id="address" placeholder="عنوان العميل">

      <label>تفاصيل الأوردر:</label>
      <textarea id="orderDetails" rows="3" placeholder="المنتجات والكميات"></textarea>

      <label>الصور المرفوعة سابقاً:</label>
      <div id="previewImages" class="image-gallery">لا توجد صور مرفوعة</div>

      <label>إرفاق صور جديدة:</label>
      <input type="file" id="images" multiple accept="image/*">

      <label>ملاحظات:</label>
      <textarea id="notes" rows="2" placeholder="ملاحظات إضافية"></textarea>

      <button onclick="saveOrder()" id="saveBtn" class="submit-btn">حفظ البيانات 💾</button>
    </div>
  </div>

  <div id="tab2" class="tab-content">
    <div id="ordersList">جاري تحميل الأوردرات...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzOGwMYbe7F3uvuVmvHrNPd8HtO_UwcrE4O7ZiohlT6dLLBqSQ7k8Ev8ntuLVXH4Q/exec"; // ضع رابط Apps Script هنا

    const firebaseConfig = {
      apiKey: "AIzaSyB5-N26tSSLfTyru_NMpSbJ97yKxcxb2PU",
      authDomain: "ordersnotification-9e391.firebaseapp.com",
      projectId: "ordersnotification-9e391",
      storageBucket: "ordersnotification-9e391.firebasestorage.app",
      messagingSenderId: "607431555434",
      appId: "1:607431555434:web:7b25ea474fdb2fe7f8cd13"
    };
    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    Notification.requestPermission().then((perm) => {
      if (perm === 'granted') messaging.getToken().then(t => console.log('FCM Token:', t));
    });

    messaging.onMessage((payload) => {
      alert(`🚨 ${payload.notification.title}\n${payload.notification.body}`);
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      document.getElementById(tabId + '-btn').classList.add('active');
    }

    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('row')) {
      document.getElementById('rowIndex').value = urlParams.get('row');
    }

    async function loadOrders() {
      const container = document.getElementById('ordersList');
      container.innerHTML = "جاري التحميل...";

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        container.innerHTML = "";
        
        data.reverse().forEach(item => {
          const isDone = item.status.includes("تم المعالجة");
          const div = document.createElement('div');
          div.className = `order-item ${isDone ? 'done' : ''}`;
          div.onclick = () => selectOrder(item);
          div.innerHTML = `
            <div class="order-header">
              <span>صف #${item.rowIndex} - ${item.amount} جنيه</span>
              <span class="badge ${isDone ? 'completed' : 'pending'}">${isDone ? 'تم المعالجة' : 'معلقة'}</span>
            </div>
            <div style="font-size: 13px; color: #666; margin-top: 5px;">
              الاسم: ${item.name || 'غير مسجل'} | المحول: ${item.phone || '-'} <br>
              التاريخ: ${item.date}
            </div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = "حدث خطأ في جلب البيانات.";
      }
    }

    function selectOrder(item) {
      document.getElementById('rowIndex').value = item.rowIndex;
      document.getElementById('address').value = item.address || '';
      
      // تحديث بيانات الهيدر العلوية (الاسم والمبلغ)
      document.getElementById('headerName').innerText = item.name || 'غير مسجل';
      document.getElementById('headerAmount').innerText = (item.amount || '0') + ' جنيه';

      const gallery = document.getElementById('previewImages');
      gallery.innerHTML = "";
      if(item.imageUrls) {
        const urls = item.imageUrls.split('\n');
        urls.forEach(url => {
          if(url.trim()) {
            const img = document.createElement('img');
            img.src = url;
            gallery.appendChild(img);
          }
        });
      } else {
        gallery.innerHTML = "لا توجد صور مرفوعة";
      }

      switchTab('tab1');
    }

    async function saveOrder() {
      const btn = document.getElementById('saveBtn');
      const rowIndex = document.getElementById('rowIndex').value;
      if(!rowIndex) return alert('برجاء تحديد رقم الصف أولاً');

      btn.disabled = true;
      btn.innerText = "جاري الحفظ والرفع...";

      const address = document.getElementById('address').value;
      const orderDetails = document.getElementById('orderDetails').value;
      const notes = document.getElementById('notes').value;
      const files = document.getElementById('images').files;

      let imagesBase64 = [];
      for(let file of files) {
        const base64 = await toBase64(file);
        imagesBase64.push({ base64: base64.split(',')[1], mimeType: file.type });
      }

      const payload = {
        action: "UPDATE_ORDER",
        rowIndex: rowIndex,
        address: address,
        orderDetails: orderDetails,
        notes: notes,
        images: imagesBase64
      };

      try {
        const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await response.json();
        if(data.status === 'success') {
          alert('تم الحفظ والتحديث بنجاح! 🎉');
        }
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "حفظ البيانات 💾";
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  </script>
</body>
</html>
